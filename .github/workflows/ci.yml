name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    uses: techorionai/constellation-ci/.github/workflows/go.yml@v0.3.0
    with:
      # The generated server code must be current. git status also shows a
      # new file that the generator made and the author did not commit.
      unit-command: go generate ./... && test -z "$(git status --porcelain)" && go test -race ./...
      # The package internal/services has many tests that start containers. With the
      # race detector the run is longer than the default test timeout of 10 minutes.
      integration-command: go test -race -tags=integration -timeout 40m ./...
      integration-timeout-minutes: 45
